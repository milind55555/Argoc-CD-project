# Child application: whoami tool. Lives in extras/ until you move it into argocd-apps/ during the demo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tools
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io   # delete this app -> delete its resources too
spec:
  project: platform
  source:
    repoURL: https://github.com/jaiswaladi246/shack-gitops.git
    targetRevision: main
    path: apps/tools
  destination:
    server: https://kubernetes.default.svc
    namespace: tools
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
