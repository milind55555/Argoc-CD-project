apiVersion: apps/v1
kind: Deployment
metadata:
  name: shack-app
  labels:
    app: shack-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shack-app
  template:
    metadata:
      labels:
        app: shack-app
    spec:
      imagePullSecrets:
        - name: ghcr-pull          # created once with kubectl, never stored in Git
      containers:
        - name: shack-app
          image: ghcr.io/jaiswaladi246/shack-app   # the tag comes from kustomization.yaml
          ports:
            - containerPort: 3000
          env:
            - name: APP_VERSION
              value: "1.0.0"
            - name: APP_MESSAGE
              value: "Built by GitHub Actions, deployed by App of Apps"
            - name: APP_COLOR
              value: "#2563EB"
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
